{{/* Giscus 评论系统 — 现代 IntersectionObserver 按需加载与 MutationObserver 日夜换肤 */}}
<div id="comments" class="pt-6">
    <div class="giscus"></div>
    <script>
        (function () {
            "use strict";

            const container = document.querySelector("div.giscus");
            if (!container) return;

            const getTheme = () =>
                document.documentElement.classList.contains("dark")
                    ? "transparent_dark"
                    : "light";

            function loadGiscus() {
                if (container.dataset.loaded === "true") return;
                container.dataset.loaded = "true";

                const script = document.createElement("script");
                script.src = "https://giscus.app/client.js";
                script.setAttribute("data-repo", "woruo03/blog");
                script.setAttribute("data-repo-id", "R_kgDOVs3knQ");
                script.setAttribute("data-category", "General");
                script.setAttribute("data-category-id", "DIC_kwDOVs3knc4DLB4b");
                script.setAttribute("data-mapping", "pathname");
                script.setAttribute("data-strict", "1");
                script.setAttribute("data-reactions-enabled", "1");
                script.setAttribute("data-emit-metadata", "0");
                script.setAttribute("data-input-position", "bottom");
                script.setAttribute("data-theme", getTheme());
                script.setAttribute("data-lang", "zh-CN");
                script.crossOrigin = "anonymous";
                script.async = true;
                container.appendChild(script);
            }

            function syncGiscusTheme() {
                const iframe = document.querySelector("iframe.giscus-frame");
                if (iframe && iframe.contentWindow) {
                    iframe.contentWindow.postMessage(
                        { giscus: { setConfig: { theme: getTheme() } } },
                        "https://giscus.app",
                    );
                }
            }

            // 1. 采用 IntersectionObserver 在读者距文末 400px 时才拉取第三方脚本与 iframe
            if ("IntersectionObserver" in window) {
                const observer = new IntersectionObserver(
                    (entries, obs) => {
                        entries.forEach((entry) => {
                            if (entry.isIntersecting) {
                                obs.disconnect();
                                loadGiscus();
                            }
                        });
                    },
                    { rootMargin: "400px 0px" },
                );
                observer.observe(container);
            } else {
                loadGiscus();
            }

            // 2. 响应式监听 <html> class 变化以同步日夜模式主题
            const themeObserver = new MutationObserver(() => syncGiscusTheme());
            themeObserver.observe(document.documentElement, {
                attributes: true,
                attributeFilter: ["class"],
            });
        })();
    </script>
</div>
