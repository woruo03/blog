{{/* Giscus 评论系统 — IntersectionObserver 按需加载 + MutationObserver / postMessage 日夜换肤同步 */}}
<div id="comments" class="pt-4">
  <div class="giscus"></div>
  <script>
    (function () {
      "use strict";

      const container = document.querySelector("div.giscus");
      if (!container) return;

      const getTheme = () =>
        document.documentElement.classList.contains("dark")
          ? "transparent_dark"
          : "light";

      let lastTheme = "";

      function loadGiscus() {
        if (container.dataset.loaded === "true") return;
        container.dataset.loaded = "true";

        lastTheme = getTheme();
        const script = document.createElement("script");
        script.src = "https://giscus.app/client.js";
        script.setAttribute("data-repo", "woruo03/blog");
        script.setAttribute("data-repo-id", "R_kgDOVs3knQ");
        script.setAttribute("data-category", "General");
        script.setAttribute("data-category-id", "DIC_kwDOVs3knc4DLB4b");
        script.setAttribute("data-mapping", "pathname");
        script.setAttribute("data-strict", "1");
        script.setAttribute("data-reactions-enabled", "1");
        script.setAttribute("data-emit-metadata", "0");
        script.setAttribute("data-input-position", "bottom");
        script.setAttribute("data-theme", lastTheme);
        script.setAttribute("data-lang", "zh-CN");
        script.crossOrigin = "anonymous";
        script.async = true;
        container.appendChild(script);
      }

      function syncGiscusTheme() {
        const nextTheme = getTheme();
        if (nextTheme === lastTheme) return;
        const iframe = document.querySelector("iframe.giscus-frame");
        if (iframe?.contentWindow) {
          lastTheme = nextTheme;
          iframe.contentWindow.postMessage(
            { giscus: { setConfig: { theme: nextTheme } } },
            "https://giscus.app",
          );
        }
      }

      // 1. 距文末 400px 时按需加载第三方脚本与 iframe
      if ("IntersectionObserver" in window) {
        const observer = new IntersectionObserver(
          (entries, obs) => {
            if (entries.some((entry) => entry.isIntersecting)) {
              obs.disconnect();
              loadGiscus();
            }
          },
          { rootMargin: "400px 0px" },
        );
        observer.observe(container);
      } else {
        loadGiscus();
      }

      // 2. 监听 <html> class 变化与 Giscus 就绪消息，消除加载期间切换主题导致的配色错位
      new MutationObserver(syncGiscusTheme).observe(document.documentElement, {
        attributes: true,
        attributeFilter: ["class"],
      });
      window.addEventListener("message", (event) => {
        if (
          event.origin === "https://giscus.app" &&
          event.data &&
          typeof event.data === "object" &&
          "giscus" in event.data
        ) {
          syncGiscusTheme();
        }
      });
    })();
  </script>
</div>
