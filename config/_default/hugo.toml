# ============================================================
# blog.woruo03.com — Hugo 核心配置
# ============================================================

baseURL = "https://blog.woruo03.com/"
defaultContentLanguage = "zh-cn"
theme = "blowfish"

# 中文与文本特性
hasCJKLanguage = true
enableEmoji = true
enableRobotsTXT = true
summaryLength = 40

# 分页配置 (现代 Hugo 规范)
[pagination]
pagerSize = 10

# 输出格式（JSON 用于 Blowfish Fuse.js 搜索索引，LLMS 生成 /llms.txt）
[outputFormats.LLMS]
mediaType = "text/plain"
baseName = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "JSON", "LLMS"]
section = ["HTML", "RSS"]
taxonomy = ["HTML"]
term = ["HTML"]

# 图片裁剪锚点
[imaging]
anchor = "Center"

# 相关文章权重引擎
[related]
includeNewer = true
threshold = 0
toLower = false

  [[related.indices]]
  name = "tags"
  weight = 100

  [[related.indices]]
  name = "categories"
  weight = 100

  [[related.indices]]
  name = "series"
  weight = 50

  [[related.indices]]
  name = "date"
  weight = 10

# 分类体系
[taxonomies]
tag = "tags"
category = "categories"
series = "series"

# 语义化文章链接
[permalinks]
posts = "/posts/:slugorfilename/"
